name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check existing issues first. Issues in English or German are both fine.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the panel with …
        2. Connect an agent …
        3. See error …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Panel version (shown in the panel header) and agent version (`harrier --version`)
      placeholder: "Panel 0.2.0, agent 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system of the affected host
      options: [Linux, Windows, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant panel or agent logs. Remove tokens and passwords.
      render: text
